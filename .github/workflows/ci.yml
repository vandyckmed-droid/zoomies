name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the in-flight run for that branch pointless.
# Except on main, where every landed commit should keep a completed result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Pinned so a new ruff release cannot turn a green branch red on its own.
      - name: Install ruff
        run: pip install ruff==0.15.8

      - name: Lint
        run: ruff check .

      - name: Compile
        run: python -m compileall -q .

      - name: Validate JSON
        run: python .github/scripts/check_json.py

      # The generated payloads are .js, so JSON parsing cannot see them. Node is
      # already on the runner, and a truncated scores.js fails this immediately.
      - name: Check generated JS
        run: |
          for f in $(git ls-files '*.js'); do
            node --check "$f"
          done
          echo "checked $(git ls-files '*.js' | wc -l) JS file(s)"

      # The test suite is optional while the repo is still taking shape.
      - name: Test
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "no tests/ directory yet - skipping"
          fi
